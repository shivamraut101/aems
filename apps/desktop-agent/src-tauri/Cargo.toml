[package]
name = "aems-desktop-agent"
version = "0.1.0"
description = "AEMS desktop monitoring agent for Windows and macOS"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Screenshot capture and active-window tracking, both cross-platform.
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["webp"] }

# Idle detection: seconds since the last keyboard or mouse input.
user-idle = "0.6"

sysinfo = "0.32"

[features]
custom-protocol = ["tauri/custom-protocol"]
